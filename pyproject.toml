[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.13",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain>=1.4.6",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "sentence-transformers>=5.7.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=4.51.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
